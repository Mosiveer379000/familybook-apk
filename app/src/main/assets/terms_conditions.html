*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font-family:Roboto,"Noto Sans Bengali","Hind Siliguri","Nirmala UI","Segoe UI",system-ui,-apple-system,Arial,sans-serif;-webkit-font-smoothing:antialiased;transition:background .2s,color .2s}
:root[data-theme="dark"] .inv{filter:invert(1)}
.page{max-width:480px;margin:0 auto;min-height:100%;background:var(--bg);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);position:relative}
button{font:inherit;color:inherit}
.view[hidden],[hidden]{display:none!important}

/* header */
.bar{position:relative;height:48px;display:flex;align-items:center;justify-content:center;border-bottom:2px solid var(--bar)}
.back,.ctl{position:absolute;top:50%;transform:translateY(-50%);width:34px;height:34px;border:0;background:none;display:flex;align-items:center;justify-content:center;cursor:pointer;border-radius:50%}
.back{left:6px}.back img{width:15px;height:15px}
.ctl .mi{width:20px;height:20px;background:var(--text);-webkit-mask:var(--m) center/contain no-repeat;mask:var(--m) center/contain no-repeat}
#themeBtn{right:42px}#langBtn{right:6px}
.back:hover,.ctl:hover{background:var(--chip)}
.back:focus-visible,.ctl:focus-visible,.item:focus-visible,.rl:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.bar h1{display:flex;align-items:center;gap:7px;font-size:16.5px;font-weight:700;letter-spacing:-.1px;max-width:calc(100% - 100px)}
.bar h1 img{width:19px;height:19px;display:block}
.bar h1 .hi[hidden]{display:none}
.menu{position:absolute;top:46px;right:8px;z-index:5;min-width:150px;background:var(--bg);border:1px solid var(--border);border-radius:10px;box-shadow:var(--menu-sh);padding:4px}
.menu button{display:flex;width:100%;align-items:center;justify-content:space-between;gap:12px;border:0;background:none;padding:8px 10px;border-radius:7px;font-size:13.5px;cursor:pointer;text-align:left}
.menu button:hover{background:var(--chip)}
.menu button[aria-checked="true"]{color:var(--blue);font-weight:700}
.menu button[aria-checked="true"]::after{content:"\2713";font-weight:700}

/* list view */
.intro{padding:8px 16px 4px;font-size:14px;line-height:1.4;color:var(--intro)}
.intro b{color:var(--blue);font-weight:700}
.list{padding:4px 0 0;list-style:none}
.item{display:flex;align-items:flex-start;padding:0 0 0 16px;cursor:pointer;text-decoration:none;color:inherit}
.item .ic{width:34px;flex:none;display:flex;justify-content:center;padding-top:14px}
.item .ic img{width:28px;height:28px;object-fit:contain;display:block}
.item .tx{flex:1;margin-left:10px;padding:10px 0 11px;border-bottom:1px solid var(--line);margin-right:56px}
.item:last-child .tx{border-bottom:0}
.item h2{font-size:15.5px;font-weight:700;line-height:1.25;letter-spacing:-.1px}
.item p{font-size:12.5px;line-height:1.3;color:var(--sub);margin-top:2px;max-width:225px}
.item p b{color:var(--blue);font-weight:700}
.item:active{background:var(--chip)}

/* terms of service view */
.brand{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;padding:12px 16px 0}
.brand .logo{width:104px;height:auto;display:block}
.search{flex:1;max-width:210px;height:28px;display:flex;align-items:center;gap:6px;border:1px solid var(--border);border-radius:8px;padding:0 9px;background:var(--field);transition:border-color .15s,box-shadow .15s}
.search:focus-within{border-color:var(--blue);box-shadow:0 0 0 3px rgba(24,119,242,.15)}
.search input{flex:1;min-width:0;border:0;outline:0;background:none;font:inherit;font-size:13px;color:var(--text)}
.search input::placeholder{color:var(--sub)}
.search img{width:15px;height:15px;opacity:.75}
.updated{margin:12px 16px 0;display:inline-flex;align-items:center;gap:6px;font-size:11.5px;color:var(--sub);background:var(--chip);border-radius:999px;padding:4px 10px}
.updated b{color:var(--text);font-weight:600}
.body{padding:0 16px}
.body p{font-size:13.5px;line-height:1.55;color:var(--intro);margin-top:10px}
.hl{color:var(--blue);font-weight:500}
.agree{margin-top:10px;display:flex;align-items:center;justify-content:space-between;gap:8px;border:1px solid var(--border);border-radius:9px;padding:6px 10px;background:var(--bg);color:var(--blue)}
.agree span{font-size:12px;font-weight:700;line-height:1.3}
.agree .tick{flex:none;width:18px;height:18px;display:block}
.rules{list-style:none;margin:14px 16px 24px;display:flex;flex-direction:column;gap:10px}
.rl{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--blue);font-weight:700;font-size:13.5px;line-height:1.45;padding:8px 10px;border:1.5px solid var(--blue);border-radius:10px}
.rl .ri{flex:none;width:24px;height:24px;display:flex;align-items:center;justify-content:center}
.rl .ri i{display:block;width:22px;height:22px;background:var(--blue);-webkit-mask:var(--m) center/contain no-repeat;mask:var(--m) center/contain no-repeat}
.rl b{font-weight:700;color:var(--blue)}
.rl:hover,.rl:active{background:rgba(24,119,242,.07)}
.empty{margin:14px 16px;font-size:13px;color:var(--sub);text-align:center}


/* controls only on first page */
body:not([data-view="list"]) .lonly{display:none}
/* why-steps view */
.hero{display:flex;align-items:center;gap:10px;margin:12px 16px 4px;padding:10px 12px;border-radius:14px;background:linear-gradient(135deg,#eef4ff,#f8fbff);border:1px solid #d3e3ff;font-size:15.5px;font-weight:700;line-height:1.35;letter-spacing:-.1px}
.hero b{color:var(--blue)}
.hico{flex:none;width:34px;height:34px;border-radius:50%;background:var(--blue);display:flex;align-items:center;justify-content:center}
.hico i{display:block;width:19px;height:19px;background:#fff;-webkit-mask:var(--m) center/contain no-repeat;mask:var(--m) center/contain no-repeat}
.hi{display:block;width:19px;height:19px;background:var(--text);-webkit-mask:var(--m) center/contain no-repeat;mask:var(--m) center/contain no-repeat}
.wtx{padding:4px 16px 8px}
.wtx p{font-size:13.5px;line-height:1.55;color:var(--intro);margin-top:8px}
.wtx .chain{font-weight:700;color:var(--blue)}
.wtx p.tight{margin-top:2px}
.shotpanel{margin:8px 16px;background:var(--chip);border-radius:14px;padding:12px 8px 12px}
.shotwrap{position:relative}
.shot{position:relative;width:58%;margin-left:9%;border:1px solid #cfd3d8;border-radius:6px;background:#fff;line-height:0}
.shot img{width:100%;height:auto;display:block;border-radius:5px}
.rbox{position:absolute;left:.5%;right:.5%;top:49%;height:12.2%;border:1.5px solid #e5262b;border-radius:5px}
.rh{position:absolute;left:82.6%;top:51.7%;width:52%;height:1.5px;background:#e5262b}
.rv{position:absolute;left:134.6%;top:51.7%;width:1.5px;height:calc(48.3% + 14px);background:#e5262b}
.rnote{width:44%;margin:14px 2px 0 auto;font-size:12px;line-height:1.35;color:var(--intro);text-align:left}
.rnote b{color:var(--blue)}
.call{padding:8px 11px;border-left:3px solid var(--blue);background:var(--chipb);border-radius:0 8px 8px 0}
.call b{color:var(--blue)}
.ph{font-size:14px;font-weight:700;margin:16px 0 4px;color:var(--text)}
.ck{list-style:none;margin:0 0 24px}
.ck li{position:relative;padding:5px 0 5px 24px;font-size:13.5px;line-height:1.5;color:var(--intro)}
.ck li::before{content:"";position:absolute;left:0;top:8px;width:15px;height:15px;background:var(--blue);-webkit-mask:var(--ckm) center/contain no-repeat;mask:var(--ckm) center/contain no-repeat}
/* read-this + AGU views */
.brand2{padding-bottom:0}
.brand2 + .hero{margin-top:12px}
.lk{margin-top:2px}
.sh{font-size:14.5px;font-weight:700;margin:20px 0 2px;color:var(--text);padding-bottom:6px;border-bottom:1px solid var(--line)}
.agu .it{margin-top:10px}
.agu h4{font-size:13.5px;font-weight:700;color:var(--text);line-height:1.35}
.agu .it p,.agu .plain{font-size:13px;line-height:1.5;color:var(--intro);margin-top:2px}
.agu .call{font-size:13px}
.blocks{list-style:none;display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:8px}
.blocks li{background:var(--chip);border-radius:9px;padding:6px 8px;display:flex;flex-direction:column;gap:1px}
.blocks b{font-size:13px;color:var(--text);font-weight:700;white-space:nowrap}
.blocks span{font-size:11.5px;color:var(--sub)}
.blocks em{font-style:normal}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.uc{border:1px solid var(--border);border-radius:10px;padding:9px 10px}
.uc h4{color:var(--blue);font-size:13px}
.uc p{font-size:12.5px;line-height:1.45;color:var(--intro);margin-top:3px}
.cd{list-style:none;margin:10px 0 12px;border:1px solid var(--border);border-radius:10px;overflow:hidden}
.cd li{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 10px;font-size:13px;color:var(--intro)}
.cd li+li{border-top:1px solid var(--line)}
.cd em{font-style:normal;font-weight:700;font-size:12px;color:var(--blue);background:var(--chipb);border-radius:999px;padding:2px 10px;white-space:nowrap}
/* dark-mode refinements */
:root[data-theme="dark"] .hero{background:linear-gradient(135deg,#1e2a3d,#1a2230);border-color:#2c4468}
:root[data-theme="dark"] .brand .logo{filter:brightness(0) invert(1)}
:root[data-theme="dark"] .search{border-color:#fff}
:root[data-theme="dark"] .search:focus-within{box-shadow:0 0 0 3px rgba(130,192,255,.25)}
:root[data-theme="dark"] .updated{background:#44474c;color:#d9dce0}
:root[data-theme="dark"] .updated b{color:#fff}

</style>
<style id="fb-desktop">
/* ===== Desktop version ===== */
@media (min-width:900px){

html body{background:var(--chip)}
body .page{max-width:1120px;padding:0 32px 48px}

body #v-list .intro b{color:#fff}
body .list{display:grid;grid-template-columns:1fr 1fr;gap:16px;padding:0}

body .item:hover,body .item:focus-visible{border-color:var(--blue)}
body .item .tx{border:0;margin-right:0}
body .item h2{font-size:19px}
body .item p{font-size:14.5px;max-width:none;line-height:1.5}
body main.view:not(#v-list){max-width:760px;margin:24px auto 0;padding:24px 28px;background:var(--bg);border-radius:20px;border:1px solid var(--line)}
body .wtx p{font-size:16px;line-height:1.7}
body .rl{font-size:15.5px;padding:14px 18px}
}
@media (min-width:900px){
body .page main.view[id]:not(#v-list){max-width:1056px;padding:32px 24px}
body main#v-tos.view[id]:not([hidden]){display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);column-gap:32px;align-content:start;align-items:start}

body #v-tos>.rules{grid-column:2;grid-row:1/span 4;margin-top:12px;gap:16px}
body #v-tos>.empty{grid-column:2;grid-row:5}
body #v-tos .brand .logo{width:150px}
body #v-tos .search{height:40px;max-width:260px}
body #v-tos .body p{font-size:16px;line-height:1.7}
body #v-tos .agree span{font-size:15px}
body #v-tos .rl{padding:22px 20px;font-size:17px}
body main#v-why.view[id]:not([hidden]){display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);column-gap:24px;align-content:start;align-items:start}
body #v-why>*{grid-column:1}
body #v-why>.hero{grid-column:1/-1}
body #v-why>.shotpanel{grid-column:2;grid-row:2/span 2;padding:24px 12px}
body main#v-read.view[id],body main#v-agu.view[id]{max-width:900px}
body .page .hero{font-size:24px;padding:20px 24px}
body .page .ck li{font-size:15.5px}
body .page .wtx .ph{font-size:18px}
body .page .agu h4{font-size:16px}
body .page .agu .it p,body .page .agu .plain,body .page .agu .call{font-size:15px;line-height:1.7}
body .page .agu .blocks{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
}

    var D=T[lang];root.lang=lang;
    [].forEach.call(document.querySelectorAll('[data-i]'),function(el){
      var v=D[el.getAttribute('data-i')];if(v==null)return;
      if(el.getAttribute('data-attr'))el.setAttribute(el.getAttribute('data-attr'),v);else el.innerHTML=v;
    });
    back.setAttribute('aria-label',D.back);themeBtn.setAttribute('aria-label',D.theme);langBtn.setAttribute('aria-label',D.lang);
    [].forEach.call(menu.querySelectorAll('button'),function(b){b.setAttribute('aria-checked',b.getAttribute('data-lang')===lang?'true':'false');});
    route();
  }
  var why=document.getElementById('v-why'),rd=document.getElementById('v-read'),ag=document.getElementById('v-agu');
  var PARENT={'#terms-of-service':'','#why-steps':'#terms-of-service','#read-this':'#terms-of-service','#agu-rules':'#terms-of-service'};
  function route(){
    var h=location.hash,D=T[lang],isList=!PARENT.hasOwnProperty(h);
    list.hidden=!isList;tos.hidden=h!=='#terms-of-service';why.hidden=h!=='#why-steps';rd.hidden=h!=='#read-this';ag.hidden=h!=='#agu-rules';
    titleic.hidden=h!=='#terms-of-service';
    document.getElementById('titleic2').hidden=h!=='#why-steps';
    document.getElementById('titleic3').hidden=h!=='#read-this';
    document.getElementById('titleic4').hidden=h!=='#agu-rules';
    var names={'':D.tc,'#terms-of-service':D.tos,'#why-steps':D.wt,'#read-this':D.rt,'#agu-rules':D.at};
    titletx.textContent=names[isList?'':h];document.title=titletx.textContent;
    document.body.setAttribute('data-view',isList?'list':'sub');
    if(!isList){menu.hidden=true;langBtn.setAttribute('aria-expanded','false');}
  }
  window.addEventListener('hashchange',function(){fromList=true;route();window.scrollTo(0,0);});
  back.addEventListener('click',function(){
    if(window.FBPage){FBPage.back();return;}   /* inside the app */
    var h=location.hash;
    if(PARENT.hasOwnProperty(h)){
      if(fromList&&history.length>1)history.back();
      else{history.replaceState(null,'',location.pathname+location.search+PARENT[h]);route();window.scrollTo(0,0);}
    }else if(history.length>1){history.back();}
  });

  themeBtn.addEventListener('click',function(){
    var n=root.getAttribute('data-theme')==='dark'?'light':'dark';
    root.setAttribute('data-theme',n);try{localStorage.setItem('fb-theme',n);}catch(e){}
  });
  langBtn.addEventListener('click',function(e){
    e.stopPropagation();menu.hidden=!menu.hidden;langBtn.setAttribute('aria-expanded',String(!menu.hidden));
  });
  menu.addEventListener('click',function(e){
    var b=e.target.closest('button[data-lang]');if(!b)return;
    lang=b.getAttribute('data-lang');try{localStorage.setItem('fb-lang',lang);localStorage.setItem('fb_lang',lang);}catch(x){}
    menu.hidden=true;langBtn.setAttribute('aria-expanded','false');applyLang();
  });
  document.addEventListener('click',function(){menu.hidden=true;langBtn.setAttribute('aria-expanded','false');});
  document.addEventListener('keydown',function(e){if(e.key==='Escape'){menu.hidden=true;langBtn.setAttribute('aria-expanded','false');}});

  /* placeholder links (href="#") do nothing until real URLs are added */
  document.addEventListener('click',function(e){
    var a=e.target.closest('a');if(a&&a.getAttribute('href')==='#')e.preventDefault();
  });

  q.addEventListener('input',function(){
    var t=q.value.trim().toLowerCase(),n=0;
    [].forEach.call(rulesUl.children,function(li){var ok=!t||li.textContent.toLowerCase().indexOf(t)>-1;li.hidden=!ok;if(ok)n++;});
    rulesUl.hidden=!n;empty.hidden=!!n;
  });

  applyLang();
})();
</script>
</body>
</html>
