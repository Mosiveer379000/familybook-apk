                const rProg = (t - this.volcanoPhase1End) / (this.volcanoPhase2End - this.volcanoPhase1End);
                this.drawRedSkyGlitchBirthday(ctx, fCtx, W, H, rProg * 0.85, 0);
            } else if (t <= this.volcanoPhase3End) {
                const bTime = t - this.volcanoPhase2End;
                const bDur = this.volcanoPhase3End - this.volcanoPhase2End;
                const fadeIn = Math.min(1, 0.85 + (bTime / 0.35) * 0.15);
                const fadeOut = bTime > (bDur - 0.55) ? Math.max(0, (bDur - bTime) / 0.55) : 1;
                this.drawRedSkyGlitchBirthday(ctx, fCtx, W, H, Math.min(fadeIn, fadeOut), bTime);
            }
        }

        drawEarthenTornadoScene(ctx, fCtx, W, H, p, t) {
            const tornadoX = -46 + p * (W + 120);
            const sceneAlpha = p < 0.06
                ? p / 0.06
                : (p > 0.90 ? Math.max(0, 1 - (p - 0.90) / 0.10) : 1);

            ctx.save();
            ctx.globalAlpha = sceneAlpha;

            ctx.fillStyle = '#FFFFFF';
            ctx.fillRect(0, 0, W, H);

            const horizonMist = ctx.createLinearGradient(0, this.groundTopY - 34, 0, this.groundTopY + 4);
            horizonMist.addColorStop(0, 'rgba(255, 255, 255, 0)');
            horizonMist.addColorStop(1, 'rgba(216, 194, 168, 0.55)');
            ctx.fillStyle = horizonMist;
            ctx.fillRect(0, this.groundTopY - 34, W, 38);

            const earthGrad = ctx.createLinearGradient(0, this.groundTopY, 0, H);
            earthGrad.addColorStop(0, '#D8C2A8');
            earthGrad.addColorStop(0.28, '#C4A786');
            earthGrad.addColorStop(0.7, '#A68663');
            earthGrad.addColorStop(1, '#7D6041');
            ctx.fillStyle = earthGrad;
            ctx.fillRect(0, this.groundTopY, W, H - this.groundTopY);

            ctx.strokeStyle = '#9C7C59';
            ctx.lineWidth = 1.5;
            ctx.beginPath();
            ctx.moveTo(0, this.groundTopY);
            for (let x = 0; x <= W; x += 16) {
                ctx.lineTo(x, this.groundTopY + Math.sin(x * 0.15) * 1.4);
            }
            ctx.stroke();

            ctx.strokeStyle = 'rgba(74, 52, 31, 0.58)';
            ctx.lineWidth = 1.2;
            for (let crack of this.earthCracks) {
                ctx.beginPath();
                ctx.moveTo(crack[0].x, crack[0].y);
                for (let k = 1; k < crack.length; k++) {
                    ctx.lineTo(crack[k].x, crack[k].y);
                }
                ctx.stroke();
            }

            const dugLimitX = Math.max(0, Math.min(W, tornadoX + 16));
            if (dugLimitX > 2) {
                const segW = W / this.trenchSegments;
                ctx.fillStyle = '#8C6B49';
                ctx.beginPath();
                ctx.moveTo(0, H);
                for (let i = 0; i <= this.trenchSegments; i++) {
                    const sx = i * segW;
                    if (sx > dugLimitX) {
                        ctx.lineTo(dugLimitX, H);
                        break;
                    }
                    const digProg = Math.min(1, Math.max(0, dugLimitX - sx) / 40);
                    ctx.lineTo(sx, H - (this.trenchDepths[i] + 18) * digProg);
                }
                ctx.lineTo(dugLimitX, H);
                ctx.closePath();
                ctx.fill();

                const trenchGrad = ctx.createLinearGradient(0, H - 32, 0, H);
                trenchGrad.addColorStop(0, '#3D2916');
                trenchGrad.addColorStop(0.55, '#291A0C');
                trenchGrad.addColorStop(1, '#1A1006');
                ctx.fillStyle = trenchGrad;
                ctx.beginPath();
                ctx.moveTo(0, H);
                for (let i = 0; i <= this.trenchSegments; i++) {
                    const sx = i * segW;
                    if (sx > dugLimitX) {
                        ctx.lineTo(dugLimitX, H);
                        break;
                    }
                    const digProg = Math.min(1, Math.max(0, dugLimitX - sx) / 32);
                    ctx.lineTo(sx, H - (this.trenchDepths[i] + 10) * digProg);
                }
                ctx.lineTo(dugLimitX, H);
                ctx.closePath();
                ctx.fill();
            }

            const baseY = this.groundTopY + 18;
            const baseX = this.getTornadoSpineX(tornadoX, 1.0, t);

            for (let plume of this.dustPlumes) {
                const px = baseX + plume.offsetX + Math.sin(t * plume.speed + plume.phase) * 7;
                const py = baseY + plume.offsetY + Math.cos(t * 2.4 + plume.phase) * 2.5;
                const pGrad = ctx.createRadialGradient(px, py, 3, px, py, plume.rx);
                pGrad.addColorStop(0, 'rgba(184, 156, 126, 0.80)');
                pGrad.addColorStop(0.55, 'rgba(150, 121, 90, 0.48)');
                pGrad.addColorStop(1, 'rgba(150, 121, 90, 0)');
                ctx.fillStyle = pGrad;
                ctx.beginPath();
                ctx.ellipse(px, py, plume.rx, plume.ry, 0, 0, Math.PI * 2);
                ctx.fill();
            }

            const topY = 18;
            const layers = 64;
            for (let i = layers; i >= 0; i--) {
                const ratio = i / layers;
                const y = topY + ratio * (baseY - topY);
                const ringX = this.getTornadoSpineX(tornadoX, ratio, t);
                const crownFlare = ratio < 0.24 ? Math.pow((0.24 - ratio) / 0.24, 1.35) * 38 : 0;
                const rapidSpinRipple = Math.sin(t * 32 + i * 0.9) * 2.4;
                const rx = 18 + Math.pow(1 - ratio, 1.36) * 56 + crownFlare + rapidSpinRipple;
                const ry = Math.max(5, rx * 0.27);

                const ringGrad = ctx.createLinearGradient(ringX - rx, y, ringX + rx, y);
                ringGrad.addColorStop(0, 'rgba(68, 49, 32, 0.90)');
                ringGrad.addColorStop(0.28, 'rgba(172, 142, 110, 0.85)');
                ringGrad.addColorStop(0.55, 'rgba(130, 100, 71, 0.90)');
                ringGrad.addColorStop(0.85, 'rgba(82, 59, 38, 0.92)');
                ringGrad.addColorStop(1, 'rgba(52, 36, 22, 0.88)');

                ctx.fillStyle = ringGrad;
                ctx.beginPath();
                ctx.ellipse(ringX, y, rx, ry, 0, 0, Math.PI * 2);
                ctx.fill();
            }

            for (let s of this.soilClods) {
                const st = s.phase;
                const cx = baseX + s.side * (6 + s.vx * st);
                const cy = baseY - (s.vy * st - 74 * st * st);
                ctx.save();
                ctx.translate(cx, cy);
                ctx.rotate(s.rot + st * 9);
                ctx.fillStyle = s.color;
                ctx.globalAlpha = Math.sin(st * Math.PI) * 0.94 * sceneAlpha;
                ctx.fillRect(-s.size * 0.5, -s.size * 0.4, s.size, s.size * 0.8);
                ctx.restore();
            }

            for (let d of this.dustParticles) {
                const y = topY + d.hRatio * (baseY - topY);
                const spineX = this.getTornadoSpineX(tornadoX, d.hRatio, t);
                const funnelR = 18 + Math.pow(1 - d.hRatio, 1.36) * 56;
                const orbitR = funnelR * d.rMult;
                const px = spineX + Math.sin(d.angle) * orbitR;
                const py = y + Math.cos(d.angle) * (orbitR * 0.25);
                const targetCtx = Math.cos(d.angle) > 0 ? fCtx : ctx;
                targetCtx.save();
                targetCtx.globalAlpha = sceneAlpha * 0.92;
                targetCtx.fillStyle = d.color;
                targetCtx.beginPath();
                targetCtx.arc(px, py, d.size, 0, Math.PI * 2);
                targetCtx.fill();
                targetCtx.restore();
            }

            if (p >= 0.47 && p <= 0.53) {
                const flashNorm = (p - 0.47) / 0.06;
                const flicker = Math.sin(flashNorm * Math.PI);
                ctx.fillStyle = `rgba(224, 242, 254, ${(flicker * 0.55).toFixed(2)})`;
                ctx.fillRect(0, 0, W, this.groundTopY);

                if (flicker > 0.2) {
                    ctx.save();
                    ctx.strokeStyle = `rgba(255, 255, 255, ${(flicker * 0.96).toFixed(2)})`;
                    ctx.shadowColor = '#38bdf8';
                    ctx.shadowBlur = 16;
                    ctx.lineWidth = 2.5;
                    ctx.beginPath();
                    let lx = Math.max(40, Math.min(W - 40, tornadoX));
                    let ly = 14;
                    ctx.moveTo(lx, ly);
                    for (let step = 1; step <= 7; step++) {
                        lx += (step % 2 === 0 ? -12 : 14);
                        ly = 14 + ((this.groundTopY - 14) * step) / 7;
                        ctx.lineTo(lx, ly);
                    }
                    ctx.stroke();
                    ctx.restore();
                }
            }

            ctx.restore();
        }

        drawBirthdayScene(ctx, W, H, alpha, localTime) {
            ctx.save();
            ctx.globalAlpha = alpha;

            const bgGrad = ctx.createRadialGradient(W * 0.5, H * 0.38, 12, W * 0.5, H * 0.45, W * 0.65);
            bgGrad.addColorStop(0, '#2B1648');
            bgGrad.addColorStop(0.55, '#171232');
            bgGrad.addColorStop(1, '#0B0D1F');
            ctx.fillStyle = bgGrad;
            ctx.fillRect(0, 0, W, H);

            for (let s of this.sparkles) {
                const twinkle = 0.35 + 0.65 * Math.abs(Math.sin(localTime * s.speed + s.phase));
                const r = s.size * twinkle;
                ctx.save();
                ctx.translate(s.x, s.y);
                ctx.fillStyle = `rgba(254, 240, 138, ${0.86 * twinkle})`;
                ctx.beginPath();
                ctx.moveTo(0, -r * 1.8);
                ctx.quadraticCurveTo(0, 0, r * 1.8, 0);
                ctx.quadraticCurveTo(0, 0, 0, r * 1.8);
                ctx.quadraticCurveTo(0, 0, -r * 1.8, 0);
                ctx.quadraticCurveTo(0, 0, 0, -r * 1.8);
                ctx.fill();
                ctx.restore();
            }

            for (let c of this.confetti) {
                ctx.save();
                ctx.translate(c.x, c.y);
                ctx.rotate(c.rot);
                ctx.fillStyle = c.color;
                ctx.fillRect(-c.w * 0.5, -c.h * 0.5, c.w, c.h);
                ctx.restore();
            }

            for (let b of this.balloons) {
                const rise = Math.min(1, localTime / 1.1);
                const easeRise = 1 - Math.pow(1 - rise, 3);
                const floatY = (b.baseY + (1 - easeRise) * 55) + Math.sin(localTime * b.speed + b.phase) * 6;
                const swayX = b.baseX + Math.cos(localTime * (b.speed * 0.8) + b.phase) * 5;
                this.draw3DBalloon(ctx, swayX, floatY, b.rx, b.ry, b.c1, b.c2, b.c3, localTime + b.phase);
            }

            const popScale = 0.85 + 0.15 * Math.min(1, localTime * 2.8);
            ctx.save();
            ctx.translate(W * 0.5, 62);
            ctx.scale(popScale, popScale);
            ctx.textAlign = 'center';

            ctx.fillStyle = 'rgba(253, 224, 71, 0.18)';
            ctx.strokeStyle = 'rgba(253, 224, 71, 0.58)';
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.roundRect(-78, -46, 156, 18, 9);
            ctx.fill();
            ctx.stroke();

            ctx.font = '700 9.5px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif';
            ctx.fillStyle = '#FDE047';
            ctx.fillText('SPECIAL BIRTHDAY WISHES', 0, -34);

            const textGrad = ctx.createLinearGradient(-110, -24, 110, 6);
            textGrad.addColorStop(0, '#FFFBEB');
            textGrad.addColorStop(0.3, '#FDE047');
            textGrad.addColorStop(0.65, '#F59E0B');
            textGrad.addColorStop(1, '#FEF08A');

            ctx.font = 'italic 900 28px Georgia, "Times New Roman", serif';
            ctx.fillStyle = textGrad;
            ctx.fillText('Happy Birthday', 0, -4);

            ctx.font = '800 18.5px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif';
            ctx.fillStyle = '#FFFFFF';
            ctx.fillText(this.profileName, 0, 20);

            ctx.restore();
            ctx.restore();
        }

        draw3DBalloon(ctx, x, y, rx, ry, cHighlight, cMid, cShadow, t) {
            ctx.save();
            ctx.strokeStyle = 'rgba(248, 250, 252, 0.55)';
            ctx.lineWidth = 1.1;
            ctx.beginPath();
            ctx.moveTo(x, y + ry + 3);
            ctx.bezierCurveTo(
                x + Math.sin(t * 2.5) * 7, y + ry + 16,
                x - Math.cos(t * 2.2) * 7, y + ry + 28,
                x + Math.sin(t * 2.0) * 4, y + ry + 40
            );
            ctx.stroke();

            const grad = ctx.createRadialGradient(
                x - rx * 0.35, y - ry * 0.35, rx * 0.1,
                x, y, Math.max(rx, ry) * 1.15
            );
            grad.addColorStop(0, cHighlight);
            grad.addColorStop(0.55, cMid);
            grad.addColorStop(1, cShadow);

            ctx.fillStyle = grad;
            ctx.beginPath();
            ctx.ellipse(x, y, rx, ry, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();
        }

        drawVolcanoBlastScene(ctx, fCtx, W, H, p, t) {
            const eruptActive = p >= 0.27;
            const eruptProgress = eruptActive ? Math.min(1, (p - 0.27) / 0.73) : 0;
            const pressure = Math.min(1, p / 0.27);
            const sceneAlpha = p < 0.06
                ? p / 0.06
                : (p > 0.90 ? Math.max(0, 1 - (p - 0.90) / 0.10) : 1);

            ctx.save();
            ctx.globalAlpha = sceneAlpha;

            const skyGrad = ctx.createLinearGradient(0, 0, 0, H);
            if (!eruptActive) {
                skyGrad.addColorStop(0, '#E2E8F0');
                skyGrad.addColorStop(0.65, '#FED7AA');
                skyGrad.addColorStop(1, '#FDBA74');
            } else {
                skyGrad.addColorStop(0, '#450A0A');
                skyGrad.addColorStop(0.52, '#991B1B');
                skyGrad.addColorStop(1, '#EA580C');
            }
            ctx.fillStyle = skyGrad;
            ctx.fillRect(0, 0, W, H);

            for (let ap of this.ashPlumes) {
                const at = ap.cycleOffset;
                const activeScale = eruptActive ? (0.58 + 0.42 * Math.sin(eruptProgress * Math.PI)) : (0.22 * pressure);
                const px = this.craterX + ap.spreadX * at * (eruptActive ? 1.18 : 0.45) + Math.sin(t * 3 + at * 6) * 6;
                const py = this.craterY - 8 - ap.riseH * at * (eruptActive ? 1.1 : 0.4);
                const r = (ap.baseR + ap.growR * at) * activeScale;
                if (r <= 1) continue;

                const ashGrad = ctx.createRadialGradient(px, py, r * 0.15, px, py, r);
                ashGrad.addColorStop(0, ap.tone);
                ashGrad.addColorStop(1, 'rgba(68, 64, 60, 0)');
                ctx.fillStyle = ashGrad;
                ctx.beginPath();
                ctx.arc(px, py, r, 0, Math.PI * 2);
                ctx.fill();
            }

            if (eruptActive) {
                const fountainIntensity = Math.sin(eruptProgress * Math.PI);
                const fHeight = 28 + fountainIntensity * 92;
                const fWidth = 24 + fountainIntensity * 30;
                const lavaColGrad = ctx.createLinearGradient(this.craterX, this.craterY, this.craterX, this.craterY - fHeight);
                lavaColGrad.addColorStop(0, '#FEF9C3');
                lavaColGrad.addColorStop(0.35, '#FACC15');
                lavaColGrad.addColorStop(0.72, '#F97316');
                lavaColGrad.addColorStop(1, 'rgba(220, 38, 38, 0)');
                ctx.fillStyle = lavaColGrad;
                ctx.beginPath();
                ctx.moveTo(this.craterX - 24, this.craterY + 4);
                ctx.quadraticCurveTo(this.craterX - fWidth, this.craterY - fHeight * 0.65, this.craterX - fWidth * 0.65, this.craterY - fHeight);
                ctx.lineTo(this.craterX + fWidth * 0.65, this.craterY - fHeight);
                ctx.quadraticCurveTo(this.craterX + fWidth, this.craterY - fHeight * 0.65, this.craterX + 24, this.craterY + 4);
                ctx.closePath();
                ctx.fill();

                const intensity = Math.sin(eruptProgress * Math.PI);
                for (let b of this.magmaBoulders) {
                    const bt = b.cycleOffset;
                    const bx = this.craterX + b.vx * bt;
                    const by = this.craterY - (b.vy * bt - 185 * bt * bt);
                    if (by > H + 10) continue;
                    ctx.save();
                    ctx.translate(bx, by);
                    ctx.rotate(b.rot + bt * b.vRot);
                    ctx.globalAlpha = Math.min(1, Math.sin(bt * Math.PI) * intensity * 1.2) * sceneAlpha;
                    ctx.fillStyle = b.crustColor;
                    ctx.beginPath();
                    ctx.arc(0, 0, b.size, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.fillStyle = b.coreColor;
                    ctx.beginPath();
                    ctx.arc(-b.size * 0.2, -b.size * 0.2, b.size * 0.55, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.restore();
                }
            }

            const riseProg = Math.min(1, p / 0.18);
            const easeRise = 1 - Math.pow(1 - riseProg, 3);
            const mountOffsetY = (1 - easeRise) * 95;
            const cX = this.craterX;
            const cY = this.craterY + mountOffsetY;

            const mountGrad = ctx.createLinearGradient(cX - 155, cY, cX + 155, H + mountOffsetY);
            mountGrad.addColorStop(0, '#44403C');
            mountGrad.addColorStop(0.32, '#292524');
            mountGrad.addColorStop(0.7, '#1C1917');
            mountGrad.addColorStop(1, '#0C0A09');
            ctx.fillStyle = mountGrad;
            ctx.beginPath();
            ctx.moveTo(cX - 185, H + mountOffsetY);
            ctx.quadraticCurveTo(cX - 88, cY + 56, cX - 30, cY);
            ctx.lineTo(cX + 30, cY);
            ctx.quadraticCurveTo(cX + 88, cY + 56, cX + 185, H + mountOffsetY);
            ctx.closePath();
            ctx.fill();

            const groundGrad = ctx.createLinearGradient(0, this.volcanoGroundY, 0, H);
            groundGrad.addColorStop(0, '#292524');
            groundGrad.addColorStop(1, '#0C0A09');
            ctx.fillStyle = groundGrad;
            ctx.fillRect(0, this.volcanoGroundY, W, H - this.volcanoGroundY);

            for (let item of this.burningIcons) {
                if (!item.visible || item.fireIntensity <= 0.02) continue;
                this.drawIconFireAndSmoke(fCtx, item.curX, item.curY, item.fireIntensity * sceneAlpha, t + item.tiltDir);
            }

            ctx.restore();
        }

        drawIconFireAndSmoke(fCtx, x, y, intensity, t) {
            fCtx.save();
            fCtx.globalAlpha = Math.min(1, intensity);
            const tongues = [
                { dx: -6, h: 24, w: 7, phase: 0.0, color: '#EA580C' },
                { dx:  5, h: 22, w: 6.5, phase: 2.1, color: '#F97316' },
                { dx:  0, h: 28, w: 8, phase: 4.2, color: '#FACC15' }
            ];
            for (let fl of tongues) {
                const flickerH = fl.h + Math.sin(t * 26 + fl.phase) * 5;
                const sway = Math.cos(t * 20 + fl.phase) * 3.5;
                fCtx.fillStyle = fl.color;
                fCtx.beginPath();
                fCtx.moveTo(x + fl.dx - fl.w, y + 4);
                fCtx.quadraticCurveTo(x + fl.dx - fl.w * 0.8, y - flickerH * 0.45, x + fl.dx + sway, y - flickerH);
                fCtx.quadraticCurveTo(x + fl.dx + fl.w * 0.8, y - flickerH * 0.45, x + fl.dx + fl.w, y + 4);
                fCtx.closePath();
                fCtx.fill();
            }
            fCtx.restore();
        }

        drawRedSkyGlitchBirthday(ctx, fCtx, W, H, alpha, localTime) {
            ctx.save();
            ctx.globalAlpha = alpha;

            const redSky = ctx.createLinearGradient(0, 0, 0, H);
            redSky.addColorStop(0, '#450A0A');
            redSky.addColorStop(0.45, '#991B1B');
            redSky.addColorStop(0.82, '#DC2626');
            redSky.addColorStop(1, '#7F1D1D');
            ctx.fillStyle = redSky;
            ctx.fillRect(0, 0, W, H);

            ctx.fillStyle = 'rgba(15, 5, 5, 0.22)';
            for (let sy = 0; sy < H; sy += 4) {
                ctx.fillRect(0, sy, W, 1.4);
            }

            const glitchCycle = (localTime * 1.35) % 1;
            const isGlitching = localTime < 0.42 || glitchCycle > 0.78;
            const glitchStrength = isGlitching ? (Math.sin(localTime * 95) * 4.5) : (Math.sin(localTime * 18) * 0.6);
            const rgbSplit = isGlitching ? 3.8 : 1.4;

            const centerX = W * 0.5;
            const titleY = 58;
            const nameY = 84;

            const drawGlitchText = (text, fontSpec, yPos, mainFill) => {
                ctx.save();
                ctx.font = fontSpec;
                ctx.textAlign = 'center';

                ctx.fillStyle = 'rgba(34, 211, 238, 0.84)';
                ctx.fillText(text, centerX - rgbSplit + glitchStrength * 0.4, yPos - (isGlitching ? 0.8 : 0));

                ctx.fillStyle = 'rgba(255, 42, 85, 0.86)';
                ctx.fillText(text, centerX + rgbSplit - glitchStrength * 0.4, yPos + (isGlitching ? 0.8 : 0));

                ctx.fillStyle = mainFill;
                ctx.fillText(text, centerX, yPos);
                ctx.restore();
            };

            drawGlitchText(
                'HAPPY BIRTHDAY',
                '900 26px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif',
                titleY,
                '#FFFFFF'
            );

            drawGlitchText(
                this.profileName.toUpperCase(),
                '800 18px ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace',
                nameY,
                '#FDE047'
            );

            ctx.restore();
        }

        start() {
            this.lastTime = performance.now();
            const loop = (now) => {
                try {
                    const dt = Math.min(0.05, Math.max(0, (now - this.lastTime) / 1000));
                    this.lastTime = now;
                    this.update(dt);
                    this.render();
                } catch (e) {}
                requestAnimationFrame(loop);
            };
            requestAnimationFrame(loop);
        }
    }

    try {
        renderProfilePortrait();

        const audio = new DualModeAudioEngine();
        const controller = new ProfileBirthdayController(audio);
        controller.start();

        window.addEventListener('resize', () => {
            controller.syncCanvasDimensions();
        });


        // ================= App API (Settings প্রিভিউ + প্রোফাইল ওভারলে) =================
        const params = new URLSearchParams(location.search);
        const isPreview = params.get('preview') === '1';
        if (isPreview) document.body.classList.add('preview');
        const bridge = window.FBBirthdayAnim || null;

        function drawNeutralAvatar() {
            const cv = document.getElementById('avatar-portrait-canvas');
            const c = cv.getContext('2d');
            c.fillStyle = '#cbd5e1'; c.fillRect(0, 0, cv.width, cv.height);
            c.fillStyle = '#334155'; c.beginPath(); c.arc(150, 112, 56, 0, Math.PI * 2); c.fill();
            c.fillStyle = '#1e293b'; c.beginPath(); c.moveTo(40, 300); c.quadraticCurveTo(60, 190, 150, 190); c.quadraticCurveTo(240, 190, 260, 300); c.closePath(); c.fill();
        }

        function drawAvatarImage(src) {
            const img = new Image();
            img.onload = () => {
                const cv = document.getElementById('avatar-portrait-canvas');
                const c = cv.getContext('2d');
                const side = Math.min(img.width, img.height);
                c.drawImage(img, (img.width - side) / 2, (img.height - side) / 2, side, side, 0, 0, cv.width, cv.height);
            };
            img.onerror = drawNeutralAvatar;
            img.src = src;
        }

        function removeItem(id) {
            const el = document.getElementById(id);
            if (!el) return;
            el.style.display = 'none';
            controller.items = controller.items.filter(i => i.el !== el);
            controller.burningIcons = controller.burningIcons.filter(i => i.el !== el);
        }

        let hiddenForVisitor = false;
        function setStat(idx, label, val) {
            const spans = document.querySelectorAll('#ui-stats-row span');
            if (spans[idx] && val !== undefined && val !== null && val !== '') spans[idx].innerHTML = '<strong>' + String(val).replace(/</g, '') + '</strong> ' + label;
        }

        function reportSize() {
            const h = Math.ceil(document.documentElement.scrollHeight);
            if (bridge && bridge.size) { try { bridge.size(h); } catch (e) {} }
        }

        window.fbAnim = {
            configure(c) {
                c = c || {};
                if (c.name) {
                    const n = document.querySelector('#ui-name-row .profile-name');
                    if (n) n.textContent = c.name;
                    controller.profileName = c.name;
                }
                if (c.avatar) drawAvatarImage(c.avatar); else drawNeutralAvatar();
                if (c.cover) {
                    const ch = document.getElementById('cover-header');
                    ch.style.backgroundImage = 'url("' + c.cover + '")';
                    ch.style.backgroundSize = 'cover';
                    ch.style.backgroundPosition = 'center';
                }
                setStat(0, 'followers', c.followers);
                setStat(2, 'following', c.following);
                setStat(4, 'posts', c.posts);
                if (c.isMe === false && !hiddenForVisitor) {
                    hiddenForVisitor = true;
                    ['ui-dashboard-btn', 'ui-settings-btn', 'ui-avatar-cam', 'ui-cover-cam'].forEach(removeItem);
                    const row = document.querySelector('.action-buttons-row');
                    if (row) row.style.display = 'none';
                    const bio = document.getElementById('ui-bio-row');
                    if (bio) bio.style.display = 'none';
                    controller.items = controller.items.filter(i => i.el.id !== 'ui-bio-row');
                }
                controller.syncCanvasDimensions();
                reportSize();
            },
            play(mode, sound) {
                controller.syncCanvasDimensions();
                if (sound !== false) { try { audio.enableAndResume(); } catch (e) {} }
                try { audio.setPaused(false); } catch (e) {}
                controller.playNow(mode);
            },
            stop() { controller.stopNow(); }
        };

        window.fbAnimDone = function () {
            if (bridge && bridge.done) { try { bridge.done(); } catch (e) {} }
            try { if (window.parent !== window) window.parent.postMessage(JSON.stringify({ fbAnim: 'done' }), '*'); } catch (e) {}
        };

        // Settings প্রিভিউ (iframe) postMessage দিয়ে চালায়
        window.addEventListener('message', (e) => {
            try {
                const m = typeof e.data === 'string' ? JSON.parse(e.data) : e.data;
                if (!m || !m.cmd) return;
                if (m.cmd === 'configure') window.fbAnim.configure(m);
                else if (m.cmd === 'play') window.fbAnim.play(m.mode, m.sound);
                else if (m.cmd === 'stop') window.fbAnim.stop();
            } catch (err) {}
        });

        document.getElementById('fb-x').addEventListener('click', () => {
            window.fbAnim.stop();
            if (bridge && bridge.close) { try { bridge.close(); } catch (e) {} }
        });

        drawNeutralAvatar();
        reportSize();
        if (bridge && bridge.ready) { try { bridge.ready(); } catch (e) {} }
        try { if (window.parent !== window) window.parent.postMessage(JSON.stringify({ fbAnim: 'ready' }), '*'); } catch (e) {}
    } catch (e) {}
};
</script>
