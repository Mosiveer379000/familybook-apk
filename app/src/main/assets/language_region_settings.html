<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Language and region</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Inter / Roboto Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'Roboto', '-apple-system', 'BlinkMacSystemFont', 'sans-serif'],
                    },
                    colors: {
                        appBlack: '#050505',
                        headerCharcoal: '#1C1E21',
                        subGray: '#65676B',
                        dividerGray: '#E4E6EB',
                        accentBlue: '#1877F2',
                    }
                }
            }
        }
    </script>
    <style>
        body.dark-theme { background:#18191A !important; color:#E4E6EB; }
        body.dark-theme #app-container, body.dark-theme header { background:#18191A !important; border-color:#3E4042 !important; }
        body.dark-theme #language-sheet { background:#242526 !important; }
        body.dark-theme .text-appBlack, body.dark-theme .text-headerCharcoal { color:#E4E6EB !important; }
        body.dark-theme .text-subGray, body.dark-theme .text-gray-600 { color:#B0B3B8 !important; }
        body.dark-theme .border-dividerGray { border-color:#3E4042 !important; }
        body.dark-theme .divide-gray-100 > :not([hidden]) ~ :not([hidden]) { border-color:#3E4042 !important; }
        body.dark-theme .bg-gray-100, body.dark-theme .bg-gray-300 { background:#3A3B3C !important; }
        body.dark-theme .hover\:bg-gray-50:hover, body.dark-theme .hover\:bg-gray-100:hover,
        body.dark-theme .active\:bg-gray-100:active, body.dark-theme .active\:bg-gray-200:active { background:rgba(255,255,255,.06) !important; }
        body.dark-theme #back-btn path { stroke:#E4E6EB; }
        body.dark-theme .border-gray-400 { border-color:#B0B3B8 !important; }
        body.dark-theme .border-accentBlue { border-color:#2D88FF !important; }
        body.dark-theme .bg-accentBlue { background:#2D88FF !important; }
        body.dark-theme input::placeholder { color:#B0B3B8; }
    </style>
</head>
<body class="bg-gray-100 min-h-screen flex justify-center items-start sm:py-6 font-sans antialiased select-none text-appBlack">

    <!-- Main Mobile Container (Full width on mobile, max-w-[480px] centered on desktop) -->
    <div id="app-container" class="w-full max-w-[480px] bg-white min-h-screen sm:min-h-[820px] sm:rounded-3xl sm:shadow-xl sm:border sm:border-gray-200 flex flex-col relative overflow-hidden">
        
        <!-- Top App Bar -->
        <header class="sticky top-0 z-10 bg-white h-14 px-2 flex items-center border-b border-dividerGray">
            <!-- Back Button -->
            <button id="back-btn" aria-label="Go back" class="w-11 h-11 rounded-full flex items-center justify-center hover:bg-gray-100 active:bg-gray-200 transition-colors duration-150 focus:outline-none">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M15.5 19L8.5 12L15.5 5" stroke="#1C1E21" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
            </button>

            <!-- Title next to back arrow -->
            <h1 class="text-[20px] font-normal tracking-[-0.01em] text-headerCharcoal ml-1.5">
                Language and region
            </h1>
        </header>

        <!-- Settings List -->
        <main class="flex-1 divide-y divide-transparent pt-1">
            
            <!-- Item 1: Language for buttons, titles and other text from Facebook -->
            <div role="button" tabindex="0" data-setting="appLanguage"
                 class="setting-item px-4 py-3.5 cursor-pointer hover:bg-gray-50 active:bg-gray-100 transition-colors duration-150 focus:outline-none">
                <div class="text-[16px] font-semibold text-appBlack leading-[1.35]">
                    Language for buttons, titles and other text from Facebook
                </div>
                <div id="subtitle-appLanguage" class="text-[15px] font-normal text-subGray mt-0.5">
                    English (US)
                </div>
            </div>

            <!-- Item 2: Language you'd like to have posts translated into -->
            <div role="button" tabindex="0" data-setting="translationLanguage"
                 class="setting-item px-4 py-3.5 cursor-pointer hover:bg-gray-50 active:bg-gray-100 transition-colors duration-150 focus:outline-none">
                <div class="text-[16px] font-semibold text-appBlack leading-[1.35]">
                    Language you'd like to have posts translated into
                </div>
                <div id="subtitle-translationLanguage" class="text-[15px] font-normal text-subGray mt-0.5">
                    Bengali
                </div>
            </div>

        </main>

        <!-- Bottom Sheet Backdrop -->
        <div id="modal-backdrop" class="fixed sm:absolute inset-0 bg-black/40 z-30 opacity-0 pointer-events-none transition-opacity duration-200"></div>

        <!-- Bottom Sheet Language Picker -->
        <div id="language-sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title"
             class="fixed sm:absolute inset-x-0 bottom-0 z-40 bg-white rounded-t-2xl shadow-2xl transform translate-y-full transition-transform duration-250 ease-out flex flex-col max-h-[82vh]">
            
            <!-- Drag Handle -->
            <div class="w-full flex justify-center pt-2.5 pb-1">
                <div class="w-10 h-1 bg-gray-300 rounded-full"></div>
            </div>

            <!-- Sheet Header -->
            <div class="px-4 py-2.5 border-b border-dividerGray flex items-center justify-between">
                <h2 id="sheet-title" class="text-[17px] font-semibold text-appBlack pr-2 leading-snug">
                    Select Language
                </h2>
                <button id="close-sheet-btn" aria-label="Close" class="w-8 h-8 rounded-full bg-gray-100 hover:bg-gray-200 flex items-center justify-center text-gray-600 shrink-0 focus:outline-none">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="18" y1="6" x2="6" y2="18"></line>
                        <line x1="6" y1="6" x2="18" y2="18"></line>
                    </svg>
                </button>
            </div>

            <!-- Search Input -->
            <div class="px-4 py-2.5 border-b border-dividerGray">
                <div class="relative flex items-center">
                    <svg class="w-4 h-4 text-subGray absolute left-3 pointer-events-none" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="11" cy="11" r="8"></circle>
                        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                    </svg>
                    <input id="language-search" type="text" placeholder="Search languages..."
                           class="w-full bg-gray-100 text-[15px] text-appBlack placeholder-subGray pl-9 pr-3 py-2 rounded-full focus:outline-none focus:ring-2 focus:ring-accentBlue/40">
                </div>
            </div>

            <!-- Language List Container -->
            <div id="language-list" class="flex-1 overflow-y-auto divide-y divide-gray-100 px-2 py-1">
                <!-- Populated dynamically via JS -->
            </div>
        </div>

        <!-- Subtle Confirmation Toast -->
        <div id="toast" role="status" aria-live="polite"
             class="pointer-events-none fixed sm:absolute bottom-6 left-1/2 transform -translate-x-1/2 translate-y-4 opacity-0 transition-all duration-200 ease-out z-50">
            <div class="bg-[#1C1E21]/95 text-white text-[13.5px] font-medium px-4 py-2 rounded-full shadow-lg whitespace-nowrap">
                <span id="toast-message">Language updated</span>
            </div>
        </div>

    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const STORAGE_KEY = 'fb_language_region_settings_v1';

            // Supported popular languages
            const LANGUAGES = [
                { value: 'English (US)', native: 'English (US)' },
                { value: 'Bengali', native: 'বাংলা' },
                { value: 'English (UK)', native: 'English (UK)' },
                { value: 'Hindi', native: 'हिन्दी' },
                { value: 'Urdu', native: 'اردو' },
                { value: 'Arabic', native: 'العربية' },
                { value: 'Spanish', native: 'Español' },
                { value: 'Mandarin Chinese', native: '中文 (简体)' },
                { value: 'French', native: 'Français' },
                { value: 'Portuguese', native: 'Português' },
                { value: 'Indonesian', native: 'Bahasa Indonesia' },
                { value: 'Turkish', native: 'Türkçe' }
            ];

            // Default state matching screenshot (342531.jpg)
            const defaultState = {
                appLanguage: 'English (US)',
                translationLanguage: 'Bengali'
            };

            // অ্যাপের ডার্ক মোড অনুযায়ী থিম
            try { if (window.FBLangApp && FBLangApp.isDark && FBLangApp.isDark()) document.body.classList.add('dark-theme'); } catch (e) {}

            // Load persisted state safely
            let state = { ...defaultState };
            try {
                const saved = localStorage.getItem(STORAGE_KEY);
                if (saved) {
                    state = { ...defaultState, ...JSON.parse(saved) };
                }
            } catch (err) {
                console.warn('Could not load saved language settings:', err);
            }

            // অ্যাপে সেভ করা ভাষা (Java: LanguagePrefs) — না থাকলে localStorage/ডিফল্ট
            try {
                if (window.FBLangApp) {
                    state.appLanguage = FBLangApp.getApp() || state.appLanguage;
                    state.translationLanguage = FBLangApp.getTrans() || state.translationLanguage;
                }
            } catch (err) { console.warn(err); }

            function persist(key, value) {
                saveState();
                try {
                    if (window.FBLangApp) {
                        if (key === 'appLanguage') FBLangApp.setApp(value);
                        else FBLangApp.setTrans(value);
                    }
                } catch (err) { console.warn(err); }
            }

            let activeSettingKey = null;
            let toastTimeout = null;

            // DOM References
            const subtitleAppLang = document.getElementById('subtitle-appLanguage');
            const subtitleTransLang = document.getElementById('subtitle-translationLanguage');
            const settingItems = document.querySelectorAll('.setting-item');
            const backBtn = document.getElementById('back-btn');

            const modalBackdrop = document.getElementById('modal-backdrop');
            const languageSheet = document.getElementById('language-sheet');
            const sheetTitle = document.getElementById('sheet-title');
            const closeSheetBtn = document.getElementById('close-sheet-btn');
            const languageSearch = document.getElementById('language-search');
            const languageList = document.getElementById('language-list');

            const toastEl = document.getElementById('toast');
            const toastMessageEl = document.getElementById('toast-message');

            /**
             * Updates the visible subtitles on the main settings screen
             */
            function renderSubtitles() {
                subtitleAppLang.textContent = state.appLanguage;
                subtitleTransLang.textContent = state.translationLanguage;
            }

            /**
             * Saves current state to localStorage
             */
            function saveState() {
                try {
                    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
                } catch (err) {
                    console.warn('Could not save language settings:', err);
                }
            }

            /**
             * Displays a brief bottom toast notification
             */
            function showToast(msg) {
                toastMessageEl.textContent = msg;
                toastEl.classList.remove('opacity-0', 'translate-y-4');
                toastEl.classList.add('opacity-100', 'translate-y-0');

                if (toastTimeout) clearTimeout(toastTimeout);
                toastTimeout = setTimeout(() => {
                    toastEl.classList.remove('opacity-100', 'translate-y-0');
                    toastEl.classList.add('opacity-0', 'translate-y-4');
                }, 1800);
            }

            /**
             * Renders the filtered list of languages inside the bottom sheet
             */
            function renderLanguageOptions(filterText = '') {
                const query = filterText.trim().toLowerCase();
                const currentSelected = state[activeSettingKey];

                const filtered = LANGUAGES.filter(lang =>
                    lang.value.toLowerCase().includes(query) ||
                    lang.native.toLowerCase().includes(query)
                );

                languageList.innerHTML = '';

                if (filtered.length === 0) {
                    languageList.innerHTML = `
                        <div class="py-8 text-center text-subGray text-[14.5px]">
                            No matching languages found
                        </div>
                    `;
                    return;
                }

                filtered.forEach(lang => {
                    const isSelected = lang.value === currentSelected;
                    const row = document.createElement('button');
                    row.type = 'button';
                    row.className = 'w-full flex items-center justify-between px-3 py-3 rounded-xl hover:bg-gray-50 active:bg-gray-100 transition-colors text-left focus:outline-none';

                    row.innerHTML = `
                        <div>
                            <div class="text-[15.5px] font-medium text-appBlack">${lang.value}</div>
                            ${lang.native !== lang.value ? `<div class="text-[13px] text-subGray">${lang.native}</div>` : ''}
                        </div>
                        <div class="w-5 h-5 rounded-full border-2 flex items-center justify-center shrink-0 ${isSelected ? 'border-accentBlue' : 'border-gray-400'}">
                            ${isSelected ? '<div class="w-2.5 h-2.5 rounded-full bg-accentBlue"></div>' : ''}
                        </div>
                    `;

                    row.addEventListener('click', () => {
                        if (activeSettingKey) {
                            state[activeSettingKey] = lang.value;
                            renderSubtitles();
                            persist(activeSettingKey, lang.value);
                            closeSheet();
                            showToast(`Updated to ${lang.value}`);
                        }
                    });

                    languageList.appendChild(row);
                });
            }

            /**
             * Opens the bottom sheet picker for a specific setting
             */
            function openSheet(settingKey) {
                activeSettingKey = settingKey;
                sheetTitle.textContent = settingKey === 'appLanguage'
                    ? 'App language'
                    : 'Translation language';

                languageSearch.value = '';
                renderLanguageOptions('');

                modalBackdrop.classList.remove('opacity-0', 'pointer-events-none');
                modalBackdrop.classList.add('opacity-100');
                languageSheet.classList.remove('translate-y-full');
            }

            /**
             * Closes the bottom sheet picker
             */
            function closeSheet() {
                modalBackdrop.classList.remove('opacity-100');
                modalBackdrop.classList.add('opacity-0', 'pointer-events-none');
                languageSheet.classList.add('translate-y-full');
                activeSettingKey = null;
            }

            // Attach click & keyboard events to setting rows
            settingItems.forEach(item => {
                const key = item.getAttribute('data-setting');
                item.addEventListener('click', () => openSheet(key));
                item.addEventListener('keydown', (e) => {
                    if (e.key === 'Enter' || e.key === ' ') {
                        e.preventDefault();
                        openSheet(key);
                    }
                });
            });

            // Search filtering
            languageSearch.addEventListener('input', (e) => {
                renderLanguageOptions(e.target.value);
            });

            // Close sheet triggers
            closeSheetBtn.addEventListener('click', closeSheet);
            modalBackdrop.addEventListener('click', closeSheet);

            // Back button interaction
            backBtn.addEventListener('click', () => {
                if (window.FBLangApp && FBLangApp.close) { FBLangApp.close(); return; }
                showToast('Returning to Settings...');
            });

            // ফোনের ব্যাক: ভাষার শিট খোলা থাকলে আগে সেটা বন্ধ (true = এখানেই সামলানো হয়েছে)
            window.fbLangBack = function () {
                if (activeSettingKey) { closeSheet(); return true; }
                return false;
            };

            // Initialize UI
            renderSubtitles();
        });
    </script>
</body>
</html>
