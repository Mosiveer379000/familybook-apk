<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#121212">
<title>Clay Bd App Store</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <img src="clay_logo.png" alt="Clay Bd App Store">
</header>

<div class="search"><input id="q" type="search" placeholder="Search apps" autocomplete="off"></div>
<nav id="chips" class="chips"></nav>

<div class="banner">New Coming<br>App Highlight</div>

<h2>Suggested Apps :</h2>
<main id="list"></main>
<p id="msg">Loading…</p>

<nav class="tabs">
  <button data-tab="games">Games</button>
  <button data-tab="apps" class="on">Apps</button>
  <button data-tab="search">Search</button>
</nav>

<div id="sheet" class="sheet" hidden>
  <div class="panel">
    <button id="close" aria-label="Close">&times;</button>
    <div class="top"><div id="sIcon"></div><div><h3 id="sName"></h3><p id="sMeta"></p></div></div>
    <a id="sBtn" class="btn big" href="#">Install</a>
    <h4>About</h4><p id="sDesc"></p>
    <h4>What's new</h4><p id="sNew"></p>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
