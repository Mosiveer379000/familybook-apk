<script>

(function(){
  var ua=navigator.userAgent;
  var inApp=!!(window.FBPage||window.FBMenu||window.FBBadgeApp)||/; wv\)/.test(ua)||location.href.indexOf('file:///android_asset/')===0;
  if(inApp){document.getElementById('fb-desktop').media='not all';return;}
  var desktopUA=!/Android|iPhone|iPod|iPad|Mobile/i.test(ua);
  if(desktopUA&&navigator.maxTouchPoints>0&&Math.min(screen.width,screen.height)<900){   /* ফোনে Desktop site */
    var m=document.querySelector('meta[name="viewport"]');
    if(m)m.setAttribute('content','width=1200');
  }
})();

    if (!I18N[LANG]) LANG = 'en';
    function t(k) { return (I18N[LANG] && I18N[LANG][k]) || I18N.en[k] || k; }
    /* [[লিংক]] এবং <g>সবুজ বোল্ড</g> চিহ্ন HTML-এ বদলায় */
    function rich(s) {
      return s.replace(/\[\[(.+?)\]\]/g, '<a href="javascript:void(0)" class="lnk">$1</a>')
              .replace(/<g>(.+?)<\/g>/g, '<span class="text-green-700 font-bold">$1</span>')
              .replace(/<b>(.+?)<\/b>/g, '<span class="font-bold text-gray-900 inline-block mt-0.5">$1</span>');
    }
    function applyLang() {
      document.documentElement.lang = LANG;
      document.documentElement.dir = RTL[LANG] ? 'rtl' : 'ltr';
      document.title = t('title');
      document.querySelectorAll('[data-i]').forEach(function (el) { el.innerHTML = rich(t(el.getAttribute('data-i'))); });
      document.querySelectorAll('[data-aria]').forEach(function (el) { el.setAttribute('aria-label', t(el.getAttribute('data-aria'))); });
    }
    /* Dark mode ফোনের System থিম বদলালে অ্যাপ এটা ডাকে */
    window.fbTheme = function (dark) { document.documentElement.classList.toggle('dk', !!dark); };

    let isChecking = false;
    let isEligible = false;
    let isActivated = true;

    const syncIcon = document.getElementById('sync-icon');
    const eligibilityBox = document.getElementById('eligibility-box');
    const screenMain = document.getElementById('screen-main');
    const screenActivation = document.getElementById('screen-activation');
    const activateBtn = document.getElementById('activate-btn');
    const toast = document.getElementById('toast');

    const HAS_APP = !!(window.FBBadgeApp);

    function closePage() {
      if (HAS_APP) FBBadgeApp.close();
      else if (history.length > 1) history.back();
      else location.href = 'terms_conditions.html';
    }

    // Android back button: activation screen -> main screen first
    window.fbBadgeBack = function () {
      if (!screenActivation.classList.contains('hidden')) { goToMainScreen(); return true; }
      return false;
    };

    function setBox(html, cls) {
      eligibilityBox.className = "w-full min-h-[34px] flex items-center justify-center px-3 py-1.5 rounded-md border border-[#8da4be] select-none text-[12.5px] transition-all duration-200 " + (cls || "");
      eligibilityBox.innerHTML = html;
    }

    function startEligibilityCheck() {
      if (isChecking) return;
      isChecking = true;
      isEligible = false;
      eligibilityBox.onclick = null;
      syncIcon.classList.add('spinning-icon');
      setBox('<span class="text-gray-400">' + t('checking') + '</span>');

      if (HAS_APP) {
        FBBadgeApp.check();            // result comes back in fbBadgeChecked(json)
      } else {
        setTimeout(() => fbBadgeChecked(JSON.stringify({ eligible: false, reasons: ['app'] })), 600);   /* website: আসল যাচাই শুধু অ্যাপে */
      }
    }

    // অ্যাপের পাঠানো কারণ-কোড (nid/age/activity/login/check_failed/offline) -> নিজের ভাষায়
    function reasonText(code) {
      const k = 'r_' + code;
      return I18N.en[k] ? t(k) : code;
    }

    // Called by the app (BlueBadgeActivity) with the real result
    window.fbBadgeChecked = function (json) {
      let r = {};
      try { r = JSON.parse(json); } catch (e) {}
      syncIcon.classList.remove('spinning-icon');
      isChecking = false;
      isEligible = !!r.eligible;

      if (isEligible) {
        isActivated = r.active !== false;
        renderActivateBtn();
        setBox('<span class="font-bold text-gray-900">' + t('you_are') + '</span><span class="font-bold text-green-700">' + t('eligible') + '</span><span class="font-bold text-[#1877F2]">' + t('click_here') + '</span>',
               'text-center cursor-pointer hover:bg-blue-50/70 active:scale-[0.99]');
        eligibilityBox.onclick = goToActivationScreen;
      } else {
        const why = (r.reasons && r.reasons.length)
          ? '<span class="block text-[11.5px] font-normal text-gray-600 mt-0.5">' + r.reasons.map(reasonText).join(' &middot; ') + '</span>' : '';
        setBox('<span class="text-center"><span class="font-bold text-red-600">' + t('not_eligible') + '</span>' + why + '</span>');
      }
    };

    function goToActivationScreen() {
      if (!isEligible) return;
      screenMain.classList.add('hidden');
      screenActivation.classList.remove('hidden');
      screenActivation.classList.add('flex');
    }

    function goToMainScreen() {
      screenActivation.classList.add('hidden');
      screenActivation.classList.remove('flex');
      screenMain.classList.remove('hidden');
    }

    function renderActivateBtn() {
      if (isActivated) {
        activateBtn.textContent = t('activated');
        activateBtn.className = 'px-4 py-1.5 bg-badge-blue text-white font-semibold rounded-md shadow-sm transition-all duration-200 text-[13px] active:scale-95 focus:outline-none';
      } else {
        activateBtn.textContent = t('deactivated');
        activateBtn.className = 'px-4 py-1.5 bg-deactivate-red text-white font-semibold rounded-md shadow-sm transition-all duration-200 text-[13px] active:scale-95 focus:outline-none';
      }
    }

    function toggleActivationState() {
      isActivated = !isActivated;
      renderActivateBtn();
      if (HAS_APP) FBBadgeApp.setActive(isActivated);
    }

    let toastTimeout;
    function demoLinkToast(linkName) {
      toast.textContent = t('demo') + ': "' + linkName + '"';
      toast.classList.remove('opacity-0');
      toast.classList.add('opacity-100');

      clearTimeout(toastTimeout);
      toastTimeout = setTimeout(() => {
        toast.classList.remove('opacity-100');
        toast.classList.add('opacity-0');
      }, 1800);
    }

    // লিংকগুলোর ক্লিক (ভাষা বদলালেও কাজ করে)
    document.addEventListener('click', function (e) {
      const a = e.target.closest ? e.target.closest('.lnk') : null;
      if (!a) return;
      if (!HAS_APP && a.closest('[data-i="who_p"],[data-i="act_p"]')) location.href = 'terms_conditions.html';
      else demoLinkToast(a.textContent);
    });

    // শুরু: ভাষা বসাও, বাটন/বক্স আঁকো
    applyLang();
    renderActivateBtn();
    setBox(t('no_result'), 'text-gray-500');
  </script>
</body>
</html>
