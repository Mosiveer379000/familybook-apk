plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.familybook.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.familybook.app"
        minSdk 24
        targetSdk 34
        versionCode 6
        versionName "1.5"
        multiDexEnabled true
    }

    // GitHub Actions থেকে signing: KEYSTORE_FILE / KEYSTORE_PASSWORD / KEY_ALIAS / KEY_PASSWORD env থেকে আসে
    signingConfigs {
        release {
            if (System.getenv("KEYSTORE_FILE")) {
                storeFile file(System.getenv("KEYSTORE_FILE"))
                storePassword System.getenv("KEYSTORE_PASSWORD")
                keyAlias System.getenv("KEY_ALIAS")
                keyPassword System.getenv("KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            if (System.getenv("KEYSTORE_FILE")) signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }

    // Media3 "unstable API" নিয়ে Lint আপত্তি করলেও বিল্ড যেন না থামে
    lint {
        abortOnError false
    }
}

dependencies {
    // AndroidX & UI Core
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.9.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'androidx.multidex:multidex:2.0.1'

    // Security & Biometric
    implementation 'androidx.biometric:biometric:1.1.0'
    implementation 'androidx.security:security-crypto:1.1.0-alpha06'

    // Network (Supabase/Media ক্লাসের জন্য)
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'

    // Image Loading (Glide)
    implementation 'com.github.bumptech.glide:glide:4.16.0'

    // ML Kit Text Recognition (NID & BID স্ক্যান করার জন্য)
    implementation 'com.google.mlkit:text-recognition:16.0.0'

    // Video compress (Media3 Transformer)
    implementation 'androidx.media3:media3-transformer:1.4.1'
    implementation 'androidx.media3:media3-effect:1.4.1'
    implementation 'androidx.media3:media3-common:1.4.1'
    implementation 'androidx.media3:media3-exoplayer:1.4.1'   // এডিট স্ক্রিনের লাইভ ইফেক্ট প্রিভিউ

    // নিজস্ব Shorts ক্যামেরা (CameraX)
    implementation 'androidx.camera:camera-core:1.3.4'
    implementation 'androidx.camera:camera-camera2:1.3.4'
    implementation 'androidx.camera:camera-lifecycle:1.3.4'
    implementation 'androidx.camera:camera-video:1.3.4'
    implementation 'androidx.camera:camera-view:1.3.4'
}
