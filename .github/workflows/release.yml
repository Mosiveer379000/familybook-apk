name: Build Release APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set version
        run: |
          VC=$((100 + ${{ github.run_number }}))
          sed -i "s/versionCode .*/versionCode $VC/" app/build.gradle
          sed -i "s/versionName .*/versionName \"1.${{ github.run_number }}\"/" app/build.gradle
          grep -n "versionCode\|versionName" app/build.gradle

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Sign APK
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > release.jks
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          APK=$(find app/build/outputs/apk/release -name "*.apk" | head -1)
          $BT/zipalign -p 4 "$APK" aligned.apk
          $BT/apksigner sign --ks release.jks \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:KEYSTORE_PASSWORD \
            --key-pass env:KEY_PASSWORD \
            --out FamilyBook.apk aligned.apk
          rm release.jks

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          files: FamilyBook.apk

      - name: Update Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          VC=$((100 + ${{ github.run_number }}))
          NOTES=$(cat whatsnew.txt 2>/dev/null || echo "Bug fixes and improvements")
          APK_URL="https://github.com/${{ github.repository }}/releases/download/v${{ github.run_number }}/FamilyBook.apk"
          jq -n --argjson vc "$VC" --arg vn "1.${{ github.run_number }}" --arg url "$APK_URL" --arg notes "$NOTES" \
            '{version_code:$vc,version_name:$vn,apk_url:$url,whats_new:$notes}' > body.json
          curl -sS --fail-with-body -X POST "$SUPABASE_URL/rest/v1/app_updates" \
            -H "apikey: $SUPABASE_SERVICE_KEY" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_KEY" \
            -H "Content-Type: application/json" \
            -d @body.json
